services:
  buildkite-oceananigans:
    build:
      context: .
      dockerfile: Dockerfile
    image: buildkite-julia-gpu:latest
    container_name: buildkite-oceananigans
    hostname: buildkite-oceananigans
    restart: unless-stopped

    # Run Docker's tini as PID 1 so it reaps orphaned processes. Without it,
    # buildkite-agent is PID 1 and never wait()s on children it didn't spawn, so
    # every Julia worker, git or ptxas left behind by a finished job stays a
    # zombie until the container is recreated.
    init: true

    shm_size: 32GB

    # Secrets (BUILDKITE_AGENT_TOKEN, DOCUMENTER_KEY) come from .env, which is
    # git-ignored. Copy .env.stub to .env and fill it in before starting.
    env_file: .env

    # Pin the container to socket 0 (NUMA node 0: 32 physical cores plus their
    # SMT siblings), which is also where GPU 3 is attached. A `cpus:` quota only
    # caps CPU *time*; it lets the container's threads spread onto every
    # physical core in the machine and take most of its real throughput while
    # still staying under a "64 CPU" limit. The cpuset leaves socket 1 untouched
    # and keeps host<->GPU memory traffic NUMA-local.
    cpuset: "0-31,64-95"

    deploy:
      resources:
        limits:
          memory: 384GB
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']  # Use only GPU 3
              capabilities: [gpu]

    volumes:
      - /mnt/storage3/docker/buildkite-oceananigans-data:/var/lib/buildkite-agent
      - /mnt/storage3/docker/buildkite-oceananigans-tmp:/tmp
